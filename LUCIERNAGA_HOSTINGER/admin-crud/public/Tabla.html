    <div class="pagination-input-container" style="margin-top: 10px; text-align: center;">
        <input type="number" id="pageInput" placeholder="Ir a página..." class="form-control" style="width: 100px; display: inline-block; margin-right: 5px;">
    </div>
    
    <script>
        $(document).ready(function() {
            $('#pageInput').on('input', function() {
                const pagina = parseInt($(this).val()); // Obtener el número de página ingresado
                const paginasTotales = $('#dataTable').DataTable().page.info().pages; // Obtener el número total de páginas
        
                // Validar si el número de página es válido
                if (!isNaN(pagina) && pagina > 0 && pagina <= paginasTotales) {
                    $('#dataTable').DataTable().page(pagina - 1).draw('page'); // Ir a la página especificada
                } else if ($(this).val() === "") {
                    // Si el campo está vacío, no hacer nada
                    return;
                } else {
                    alert('Número de página no válido. Ingresa un valor entre 1 y ' + paginasTotales + '.');
                }
            });
        });
    </script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Selecciona todos los campos de texto del formulario editForm
        const textFields = document.querySelectorAll("#editForm input[type='text']");
    
        textFields.forEach(field => {
            // Agrega un evento de entrada a cada campo
            field.addEventListener("input", function () {
                // Remueve espacios al principio del valor
                this.value = this.value.replace(/^\s+/, "");
    
                // Remueve cualquier doble espacio en el valor
                this.value = this.value.replace(/\s{2,}/g, " ");
    
                // Convierte el texto a mayúsculas
                this.value = this.value.toUpperCase();
            });
        });
    });
    </script>
    <script>
$('#dataTable').on('draw.dt', function () {
    $('#dataTable tbody tr').each(function () {
        let elaboradoCalidadCell = $(this).find("td").eq(33); // Ajusta este índice si es necesario
        if (elaboradoCalidadCell.text().trim() !== "") {
            $(this).css("background-color", "#e9f7e5"); // Verde más claro
        }
    });
});

</script>


<style>
/* Ocultar campos según la clase */
.hidde-santa-marta, .hidde-otras-sedes {
    display: none;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    let currentUserSede = "";

    try {
        const res = await fetch('/currentUser');
        if(res.ok){
            const data = await res.json();
            currentUserSede = data.sede || "OTRA SEDE";
        }
    } catch(err){
        console.error("Error obteniendo sede:", err);
        currentUserSede = "OTRA SEDE";
    }

    if(currentUserSede === "SANTA MARTA-PROYECTO"){
        // Mostrar campos Santa Marta quitando la clase hidde-santa-marta
        document.querySelectorAll('.hidde-santa-marta').forEach(el => el.style.display = 'block');
        // Ocultar campos de otras sedes
        document.querySelectorAll('.hidde-otras-sedes').forEach(el => el.style.display = 'none');

        // Cambiar etiquetas dinámicas
        document.getElementById('labelNumeroDoc').textContent = "INICIAL";
        document.getElementById('labelNumeroDocHasta').textContent = "FINAL";
        document.getElementById('labelNotas').textContent = "OBSERVACIONES";

    } else {
        // Mostrar campos de otras sedes
        document.querySelectorAll('.hidde-otras-sedes').forEach(el => el.style.display = 'block');
        // Ocultar campos Santa Marta
        document.querySelectorAll('.hidde-santa-marta').forEach(el => el.style.display = 'none');

        // Cambiar etiquetas dinámicas
        document.getElementById('labelNumeroDoc').textContent = "NUMERO DOCUMENTO DESDE";
        document.getElementById('labelNumeroDocHasta').textContent = "NUMERO DOCUMENTO HASTA";
        document.getElementById('labelNotas').textContent = "NOTAS";
    }
});




</script>
