<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Estilo/Estilo_Admin.css">

    <title>Panel de Administración</title>
</head>
<body>
    <header class="header">
        <div class="dropdown">
            <button class="dropdown-button">Opciones</button>
            <div class="dropdown-content">
                <a id="logout-link" href="#">Salir</a>
                <a href="Principal_modulo.html" id="vista-modulo">Visualizar Modulos</a>
                <a href="Tabla.html" id="vista-tabla">Visualizar Tabla</a>
                <a href="Historial.html" id="view-data">Visualizar Historial</a>
            </div>
        </div>
    </header>

    <main class="admin-container">
        <!-- Formulario de creación de usuario -->
        <form id="create-form" class="admin-form">
            <h2>Crear Usuario</h2>
            <label for="create-cc">CC:</label>
            <input type="text" id="create-cc" required>
            <label for="create-name">Nombre:</label>
            <input type="text" id="create-name" required>
            <label for="create-password">Contraseña:</label>
            <input type="password" id="create-password" required>
            <label for="create-role">Rol:</label>
            <select id="create-role" required>
                <option value="TECNICA">TECNICA</option>
                <option value="CALIDAD">CALIDAD</option>
                <option value="LIDER">LIDER</option>
                <option value="ADMIN">ADMIN</option>
            </select>
            <label for="create-sede">Sede:</label>
            <select id="create-sede" required>
                <option value="BARRANQUILLA">BARRANQUILLA</option>
                <option value="SANTA MARTA">SANTA MARTA</option>
                <option value="BUCARAMANGA">BUCARAMANGA</option>
                <option value="BOGOTA">BOGOTA</option>
            </select>
            <button type="submit">Crear</button>
        </form>

        <!-- Formulario de edición de usuario -->
        <form id="edit-form" style="display: none;" class="admin-form">
            <h2>Editar Usuario</h2>
            <label for="edit-cc">CC:</label>
            <input type="text" id="edit-cc" required>
            <label for="edit-name">Nombre:</label>
            <input type="text" id="edit-name" required>
            <label for="edit-password">Contraseña:</label>
            <input type="password" id="edit-password" required>
            <label for="edit-role">Rol:</label>
            <select id="edit-role" required>
                <option value="TECNICA">TECNICA</option>
                <option value="CALIDAD">CALIDAD</option>
                <option value="LIDER">LIDER</option>
                <option value="ADMIN">ADMIN</option>
            </select>
            <label for="edit-sede">Sede:</label>
            <select id="edit-sede" required>
                <option value="BARRANQUILLA">BARRANQUILLA</option>
                <option value="SANTA MARTA">SANTA MARTA</option>
                <option value="BUCARAMANGA">BUCARAMANGA</option>
                <option value="BOGOTA">BOGOTA</option>
            </select>
            <button type="submit">Actualizar</button>
        </form>

        <!-- Buscador de usuarios -->
        <input type="text" id="user-search" placeholder="Buscar usuario..." class="search-input">

        <!-- Tabla de usuarios -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>CC</th>
                        <th>Nombre</th>
                        <th>Rol</th>
                        <th>Sede</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
                    <!-- Los usuarios se cargarán aquí -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="admin.js"></script>


    <script>
        document.getElementById('user-search').addEventListener('keyup', function() {
    const searchValue = this.value.toLowerCase();
    const rows = document.querySelectorAll('#user-table-body tr');

    rows.forEach(row => {
        const cells = row.querySelectorAll('td');
        const cc = cells[0].textContent.toLowerCase();
        const name = cells[1].textContent.toLowerCase();
        const role = cells[2].textContent.toLowerCase();
        const sede = cells[3].textContent.toLowerCase();

        if (cc.includes(searchValue) || name.includes(searchValue) || role.includes(searchValue) || sede.includes(searchValue)) {
            row.style.display = '';
        } else {
            row.style.display = 'none';
        }
    });
});
    </script>
</body>
</html>
