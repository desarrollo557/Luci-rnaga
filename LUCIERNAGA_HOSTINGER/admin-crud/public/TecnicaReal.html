<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecnica Real</title>
    <link rel="stylesheet" href="/Estilo/Estilo_Tecnica_Real.css">

   
</head>
<body>
    <header>
        <!-- Botón Hamburguesa -->
        <div id="menu-hamburguesa">
            <img src="imagen/menu.png" alt="Menú" id="icono-menu">
        </div>
    
        <!-- Menú Desplegable -->
        <div id="menu-desplegable" class="menu-desplegable">
            <button id="admin-btn">Usuarios</button>
            <button id="btn-inventario">Inventario</button>
            <button id="tabla-btn">Ver Tabla</button>
            <button id="historial-btn">Historial</button>
        </div>
	<button id="backcliente">Regresar</button>
        <button id="insertar-modulo-cliente">Insertar Módulo Cliente</button>
    
        <!-- Estos elementos se sacan del menú hamburguesa y vuelven a estar en el header -->
        <h1>Bienvenido, <span id="usuario-nombre"></span></h1>
        <button id="salir-sesion">Salir Sesión</button>
    </header>
    

    <!-- Buscador que incluye la búsqueda por acta transferencia -->
    <div id="buscador">
        <h2 class="TITULO">ACTAS DE <span id="entidadRemitenteDisplay"></span></h2>
        <input type="text" id="input-buscador" placeholder="Buscar por entidad remitente o código...">
    </div>
    
    
    <div id="contenedor-modulos"></div>

    <!-- Modal para insertar módulo cliente -->
    <div id="modalFormularioModulo" class="modalFormulario">
        <h2>Insertar Módulo Cliente</h2>
        <input type="text" id="codigo" placeholder="Código del Módulo">
        <input type="text" id="entidadRemitente" placeholder="Entidad Remitente">
        <input type="text" id="actaTransferencia" placeholder="Acta de Transferencia">
        <input type="date" id="fechatrans_modulo" placeholder="Fecha de Transferencia">
        <div class="modal-buttons">
            <button id="guardarModulo" class="btn-accion">Guardar</button>
            <button id="cerrarModalFormulario" class="btn-cerrar">Cerrar</button>
        </div>
    </div>

    <!-- Modal para seleccionar usuarios TECNICA -->
    <div id="modalSeleccionUsuario" class="modal" style="display:none;">
        <div class="modal-content">
            <h2>Seleccionar Usuario TECNICA</h2>
            <ul id="listaUsuariosTecnica">
                <!-- Aquí se llenarán los usuarios TECNICA con casillas de selección -->
            </ul>
            <div class="modal-buttons" style="margin-top: 20px;">
                <button id="agregarSeleccionados" class="btn-accion">Agregar</button>
                <button id="eliminarSeleccionados" class="btn-accion">Eliminar</button>
            </div>
            <button id="cerrarModal" class="btn-cerrar">Cerrar</button>
        </div>
    </div>

    <script src="TecnicaReal.js"></script>
    <script>
        // Redireccionar a inventario.html al hacer clic en el botón
        document.getElementById("btn-inventario").addEventListener("click", function() {
            window.location.href = "Inventario.html";
        });

        // Redireccionar a historial.html al hacer clic en el botón
        document.getElementById("historial-btn").addEventListener("click", function() {
            window.location.href = "Historial.html";
        });

        // Redireccionar a admin.html al hacer clic en el botón
        document.getElementById("admin-btn").addEventListener("click", function() {
            window.location.href = "Admin.html";
        });
        document.getElementById('menu-hamburguesa').addEventListener('click', function() {
            var menu = document.getElementById('menu-desplegable');
            menu.classList.toggle('active');
        });
	document.getElementById('backcliente').addEventListener('click', function() {
        window.location.href = 'Principal_modulo.html';
        });

    </script>
</body>
</html>
