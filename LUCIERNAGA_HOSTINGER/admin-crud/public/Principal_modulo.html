<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignación de Sub-Módulos</title>
    <link rel="stylesheet" href="/Estilo/Estilo_Principal.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>
<body>
    <header>
        <div class="dropdown">
            <button id="insertar-modulo-cliente">Crear Cliente</button>
        </div>

        <div class="dropdown">
            <button id="BtnProduccion">Ingresar a Produccion</button>
        </div>

        <h1>Bienvenido, <span id="usuario-nombre"></span></h1>
        <button id="salir-sesion">Salir Sesión</button>
    </header>

    <div id="buscador">
        <h2 class="TITULO">CLIENTE</h2>
        <input type="text" id="input-buscador" placeholder="Buscar por entidad remitente o código...">
    </div>

    <div id="contenedor-modulos"></div>

    <!-- Modal para insertar sub-módulo -->
    <div id="modalFormularioSubModulo" class="modalFormulario">
        <h2>Insertar Cliente </h2>
        <input type="text" id="codigo" placeholder="Código del Cliente">
        <input type="text" id="entidadRemitente" placeholder="Entidad Remitente">
        <input type="text" id="sedesubmodulo" placeholder="Sede">
        <div class="modal-buttons">
            <button id="guardarSubModulo" class="btn-accion">Guardar</button>
            <button id="cerrarModalFormulario" class="btn-cerrar">Cerrar</button>
        </div>
    </div>

    <!-- Modal para seleccionar usuarios TECNICA y CALIDAD -->
    <div id="modalSeleccionUsuario" class="modal" style="display:none;">
        <div class="modal-content">
            <h2>Seleccionar Usuario <span id="rol-usuario-modal"></span></h2>
            <ul id="listaUsuariosTecnica">
                <!-- Aquí se llenarán los usuarios TECNICA o CALIDAD con casillas de selección -->
            </ul>
            <div class="modal-buttons" style="margin-top: 20px;">
                <button id="agregarSeleccionados" class="btn-accion">Agregar</button>
                <button id="eliminarSeleccionados" class="btn-accion">Eliminar</button>
            </div>
            <button id="cerrarModal" class="btn-cerrar">Cerrar</button>
        </div>
    </div>

    <div id="paginacion" class="paginacion">
        <button id="prevPage" class="disabled" onclick="cambiarPagina('prev')">Anterior</button>
        <span id="currentPage">Página 1</span>
        <button id="nextPage" onclick="cambiarPagina('next')">Siguiente</button>
        <br>
        <input type="number" id="paginaInput" min="1" placeholder="Ingresa un número de página" />
        <button id="goToPage" onclick="irAPagina()">Ir</button>
        <p id="mensajeErrorPagina" style="color: red; display: none;">Número de página no válido</p>
    </div>
    

    <script src="Principal_modulo.js"></script>


    <script>
     $('#BtnProduccion').on('click', function () {
    fetch('/currentUser')
        .then(response => {
            if (!response.ok) throw new Error('No autenticado');
            return response.json();
        })
        .then(user => {
            if (user && user.nombre && user.cc) {
                // Guardar en localStorage y sessionStorage como redundancia
                const userIdentifier = `${user.nombre.trim().toUpperCase()} (${user.cc})`;
                localStorage.setItem('currentProducer', userIdentifier);
                sessionStorage.setItem('currentProducer', userIdentifier);
                
                // Redirigir usando location.replace para evitar problemas de caché
                window.location.replace('Produccion.html');
            } else {
                alert('Datos de usuario incompletos');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Debe iniciar sesión para acceder a Producción');
        });
});
    </script>
    
</body>
</html>
