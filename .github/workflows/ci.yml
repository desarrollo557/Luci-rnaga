name: CI — Pipeline Orquestador

on:
  push:
    branches: [develop, production, main]
  pull_request:
    branches: [develop, production, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validate:
    name: Backend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend-test:
    name: Backend — pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Sin sparse-checkout: las pruebas de espejos comparan los catálogos y los
      # límites del backend con sus copias en frontend/src/lib, así que necesitan
      # el repositorio completo.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas de validadores
        run: npm test

  frontend-validate:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  orchestrator:
    name: Orquestador — gate final
    needs: [backend-validate, backend-test, frontend-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar validaciones
        run: echo "✅ Backend y Frontend validados. Cambio listo para merge en ${{ github.ref_name }}."
